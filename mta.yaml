_schema-version: 3.3.0
ID: BTP_CI_CD_Deployment_CAPM
version: 1.0.0
description: "CAPM project with PostgreSQL (existing service)"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: BTP_CI_CD_Deployment_CAPM-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: BTP_CI_CD_Deployment_CAPM-postgres
      - name: BTP_CI_CD_Deployment_CAPM-auth

  - name: BTP_CI_CD_Deployment_CAPM-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: BTP_CI_CD_Deployment_CAPM-postgres

  - name: BTP_CI_CD_Deployment_CAPM-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 256M
      keep-existing-routes: true
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: BTP_CI_CD_Deployment_CAPM-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: BTP_CI_CD_Deployment_CAPM-postgres
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: PostgreSQLInstance

  - name: BTP_CI_CD_Deployment_CAPM-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: BTP_CI_CD_Deployment_CAPM
        tenant-mode: dedicated